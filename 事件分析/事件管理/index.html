<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件分析 - 事件管理</title>
    <style>
        :root {
            --primary: #2b61f0;
            --primary-deep: #1a4ed4;
            --text: #1e2d45;
            --text-soft: #6b7c95;
            --text-faint: #9eb0c6;
            --success: #12a87a;
            --danger: #e04040;
            --warning: #c47d10;
            --sidebar-width: 220px;
            font-family: "PingFang SC", "Lantinghei SC", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei UI", "微软雅黑", sans-serif;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--text);
            background: #eef1f8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a,
        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 44px 1fr;
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            grid-row: 1 / -1;
            margin: 0;
            padding: 0;
            background: #ffffff;
            border-radius: 0;
            overflow: visible;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 8px rgba(26, 44, 82, 0.08);
        }

        .sidebar-nav-area {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 10px 8px;
        }

        .sidebar-nav-area::-webkit-scrollbar {
            width: 3px;
        }

        .sidebar-nav-area::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 999px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 14px;
            height: 44px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.07);
            flex: 0 0 44px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
        }

        .brand-title strong {
            font-size: 14px;
            letter-spacing: 0.02em;
            color: var(--text);
            font-weight: 700;
            white-space: nowrap;
        }

        .nav-group {
            margin-bottom: 0;
        }

        .nav-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 24px 6px 5px;
            margin-bottom: 2px;
            border-radius: 6px;
            color: #8a9ab8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }

        .nav-group-title:hover {
            color: #4a5c7a;
            background: transparent;
        }

        .nav-group-title .title-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-group-title svg {
            width: 12px;
            height: 12px;
            color: #8a9ab8;
        }

        .nav-group-title small {
            display: inline-flex;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.35);
            font-weight: 400;
            letter-spacing: 0;
            transition: transform 0.2s;
        }

        .nav-group.collapsed .nav-group-title small {
            transform: rotate(180deg);
        }

        .nav-group.active .nav-group-title {
            color: #4a5c7a;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-bottom: 2px;
        }

        .nav-group.collapsed .nav-items {
            display: none;
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 34px;
            padding: 5px 10px 5px 14px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #4a5c7a;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.15s, color 0.15s;
        }

        .nav-item:hover {
            background: rgba(43, 97, 240, 0.06);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(43, 97, 240, 0.09);
            color: var(--primary);
            font-weight: 700;
        }

        .nav-item.active::after {
            content: "";
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            border-radius: 999px;
            background: var(--primary);
        }

        .nav-item small {
            display: none;
        }

        /* ── Global Topbar ── */
        .global-topbar {
            grid-column: 2;
            grid-row: 1;
            position: sticky;
            top: 0;
            z-index: 50;
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px 0 14px;
            background: #ffffff;
            border-bottom: 1px solid rgba(122, 145, 184, 0.14);
            box-shadow: 0 1px 4px rgba(26, 44, 82, 0.06);
            gap: 10px;
        }

        .topbar-module-label {
            font-size: 13px;
            color: var(--text-soft);
            font-weight: 600;
        }

        .topbar-parent {
            color: var(--text-faint);
            font-weight: 500;
        }

        .topbar-sep {
            color: #c5cdd9;
            font-size: 12px;
        }

        .topbar-spacer {
            flex: 1 1 auto;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #7a8ea8;
            transition: background 0.15s, color 0.15s;
        }

        .icon-button:hover {
            background: rgba(43, 97, 240, 0.08);
            color: var(--primary);
        }

        .avatar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 3px;
            border-radius: 999px;
            background: rgba(43, 97, 240, 0.07);
            border: 1px solid rgba(43, 97, 240, 0.13);
            color: var(--text);
        }

        .avatar strong {
            color: var(--text);
            font-size: 12px;
        }

        .avatar-badge {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
        }

        /* ── Main area ── */
        .main-area {
            min-width: 0;
            grid-row: 2;
            background: #eef1f8;
            min-height: calc(100vh - 44px);
            display: flex;
            flex-direction: column;
        }

        .page {
            padding: 14px 16px 32px;
        }

        /* ── Toolbar ── */
        .management-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(26, 44, 82, 0.05);
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .create-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }

        .create-button:hover {
            background: var(--primary-deep);
        }

        .toolbar-hint {
            color: var(--text-soft);
            font-size: 14px;
        }

        .toolbar-hint strong {
            color: var(--primary);
            font-weight: 700;
        }

        .toolbar-select {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 8px;
            border-radius: 8px;
            border: 1px solid rgba(122, 145, 184, 0.2);
            background: #ffffff;
            color: var(--text-soft);
            font-size: 14px;
        }

        .toolbar-select select {
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            font-size: 14px;
        }

        .toolbar-search {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 32px;
            min-width: 220px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid rgba(122, 145, 184, 0.2);
            background: #ffffff;
            font-size: 14px;
        }

        .toolbar-search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
        }

        .toolbar-search input::placeholder {
            color: var(--text-faint);
        }

        .search-count {
            color: var(--text-faint);
            font-size: 11px;
            white-space: nowrap;
        }

        /* ── Card Grid ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
            align-items: start;
        }

        .event-card {
            position: relative;
            overflow: visible;
            border-radius: 10px;
            border: 1px solid rgba(122, 145, 184, 0.14);
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(26, 44, 82, 0.06);
            cursor: pointer;
            transition: box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .event-card:hover {
            border-color: rgba(43, 97, 240, 0.2);
            box-shadow: 0 4px 14px rgba(26, 44, 82, 0.1);
        }

        .card-cover {
            position: relative;
            min-height: 96px;
            padding: 14px 14px 12px;
            border-radius: 10px 10px 0 0;
            color: #ffffff;
        }

        .card-cover.sky {
            background: linear-gradient(135deg, #2794ff 0%, #63b7ff 100%);
        }

        .card-cover.green {
            background: linear-gradient(135deg, #11b69d 0%, #15c16d 100%);
        }

        .card-cover.purple {
            background: linear-gradient(135deg, #9566ff 0%, #625ff0 100%);
        }

        .card-cover.blue {
            background: linear-gradient(135deg, #1f3ef4 0%, #0c6cff 100%);
        }

        .template-flag {
            position: absolute;
            top: 0;
            right: 0;
            min-height: 24px;
            padding: 0 10px;
            border-radius: 0 10px 0 8px;
            background: rgba(0, 0, 0, 0.22);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
        }

        .card-title {
            margin: 0;
            font-size: 15px;
            line-height: 1.35;
            font-weight: 700;
        }

        .card-range {
            display: inline-flex;
            align-items: center;
            margin-top: 28px;
            padding: 4px 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 11px;
            font-weight: 500;
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            padding: 8px 12px 6px;
        }

        .stat-block {
            min-width: 0;
        }

        .stat-value {
            display: flex;
            align-items: baseline;
            gap: 1px;
            color: var(--primary);
        }

        .stat-value strong {
            font-size: 18px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .stat-value em {
            font-style: normal;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.85;
        }

        .stat-label {
            margin-top: 4px;
            color: var(--text-faint);
            font-size: 11px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px 10px;
            border-top: 1px solid rgba(122, 145, 184, 0.1);
        }

        .edit-meta {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-faint);
            font-size: 11px;
        }

        .edit-meta svg {
            width: 12px;
            height: 12px;
            color: var(--text-faint);
        }

        .card-menu-wrap {
            position: relative;
        }

        .card-menu-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(122, 145, 184, 0.14);
            border-radius: 7px;
            background: transparent;
            color: var(--text-faint);
        }

        .card-menu-button:hover {
            background: rgba(43, 97, 240, 0.06);
            color: var(--primary);
        }

        .card-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            width: 120px;
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(26, 44, 82, 0.12);
            display: none;
            z-index: 20;
        }

        .card-menu.open {
            display: block;
        }

        .card-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 32px;
            padding: 0 8px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-soft);
            font-size: 14px;
            text-align: left;
        }

        .card-menu button:hover {
            background: rgba(43, 97, 240, 0.07);
            color: var(--primary);
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 56px 28px;
            border-radius: 10px;
            border: 1px dashed rgba(98, 146, 216, 0.24);
            background: #ffffff;
            color: var(--text-soft);
            text-align: center;
        }

        .empty-state strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            color: var(--text);
        }

        .toast-stack {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 90;
        }

        .toast {
            min-width: 220px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(22, 35, 65, 0.92);
            color: #ffffff;
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(8, 15, 31, 0.18);
            animation: toastIn 0.2s ease;
        }

        .mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(20, 31, 63, 0.24);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease;
            z-index: 20;
        }

        .is-sidebar-open .mobile-mask {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1560px) {
            .card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 1280px) {
            .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 1080px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 44px 1fr;
            }

            .global-topbar { grid-column: 1; }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                height: 100vh;
                width: min(84vw, 280px);
                transform: translateX(-100%);
                transition: transform 0.24s ease;
                z-index: 30;
                box-shadow: 4px 0 24px rgba(17, 24, 39, 0.18);
            }

            .is-sidebar-open .sidebar {
                transform: translateX(0);
            }

            .main-area {
                grid-column: 1;
            }
        }

        @media (max-width: 760px) {
            .management-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left,
            .toolbar-right {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-search,
            .toolbar-select,
            .create-button {
                width: 100%;
            }

            .card-grid { grid-template-columns: 1fr; }
            .card-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>

                        <a class="nav-item" href="../../处置引导/多稿合并工具/index.html"><span>多稿合并工具</span></a>

                    </div>

                <section class="nav-group">
                    <div class="nav-group-title">
                        <div class="title-left">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 5H18V19H6V5ZM9 9H15M9 13H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

                        <div class="nav-item"><span>宣传引导策略库</span></div>
                        <div class="nav-item"><span>决策报告知识库</span></div>
                        <div class="nav-item"><span>重点关注对象库</span></div>
                        <div class="nav-item"><span>行业术语与本体知识库</span></div>
                    </div>
                </section>
            </div>
        </aside>

        <main class="main-area">
            <section class="page">
                <section class="management-toolbar">
                    <div class="toolbar-left">
                        <button class="create-button" id="createButton" type="button">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                            创建分析
                        </button>
                        <span class="toolbar-hint">已创建 <strong>5</strong> 个专题 / 已启用模板 <strong>50</strong> 个</span>
                    </div>
                    <div class="toolbar-right">
                        <label class="toolbar-select">
                            <select id="sortSelect">
                                <option value="recent">最近编辑</option>
                                <option value="title">按标题</option>
                                <option value="volume">按数据量</option>
                            </select>
                        </label>
                        <label class="toolbar-select">
                            <select id="templateSelect">
                                <option value="all">所有模板</option>
                                <option value="default">默认模板</option>
                                <option value="custom">自定义模板</option>
                            </select>
                        </label>
                        <label class="toolbar-search">
                            <input id="searchInput" type="search" maxlength="100" placeholder="输入筛选内容">
                            <span class="search-count" id="searchCount">0/100</span>
                        </label>
                    </div>
                </section>

                <section class="card-grid" id="cardGrid"></section>
            </section>
        </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <script>
        const baseEventCards = [
            {
                id: "event-1",
                title: "大埔宏福苑大火",
                range: "2025-11-26 15:24:46-2025-11-27 15:24:46",
                template: "default",
                templateLabel: "默认模板",
                theme: "sky",
                dataTotal: 2311,
                mediaTotal: 930,
                peakSpread: 76,
                lastEdited: "2025-11-27 15:24:46"
            },
            {
                id: "event-2",
                title: "河北廊坊4.2级地震",
                range: "2026-02-24 15:24:46-2026-03-03 15:24:46",
                template: "default",
                templateLabel: "默认模板",
                theme: "green",
                dataTotal: 301,
                mediaTotal: 147,
                peakSpread: 27,
                lastEdited: "2025-04-21 17:18:09"
            },
            {
                id: "event-3",
                title: "文在寅父女被调查",
                range: "2026-02-24 15:24:46-2026-03-03 15:24:46",
                template: "default",
                templateLabel: "默认模板",
                theme: "purple",
                dataTotal: 981,
                mediaTotal: 531,
                peakSpread: 313,
                lastEdited: "2025-03-25 19:20:28"
            },
            {
                id: "event-4",
                title: "国足vs澳大利亚",
                range: "2026-02-24 15:24:46-2026-03-03 15:24:46",
                template: "default",
                templateLabel: "默认模板",
                theme: "blue",
                dataTotal: 333621,
                mediaTotal: 47252,
                peakSpread: 10716,
                lastEdited: "2025-03-25 19:17:24"
            },
            {
                id: "event-5",
                title: "青海党员干部上缴礼金",
                range: "2026-02-24 15:24:46-2026-03-03 15:24:46",
                template: "default",
                templateLabel: "默认模板",
                theme: "sky",
                dataTotal: 0,
                mediaTotal: 0,
                peakSpread: 0,
                lastEdited: "2025-03-25 19:15:07"
            }
        ];

        const STORAGE_KEY = "eventAnalysisCreatedCards";
        const CREATE_PAGE_PATH = "./创建分析/index.html";
        const DETAIL_PAGE_PATH = "./事件分析详情/index.html";
        const baseCardIds = new Set(baseEventCards.map((item) => item.id));
        let eventCards = [];

        const state = {
            search: "",
            sort: "recent",
            template: "all"
        };

        const cardGrid = document.getElementById("cardGrid");
        const createButton = document.getElementById("createButton");
        const sortSelect = document.getElementById("sortSelect");
        const templateSelect = document.getElementById("templateSelect");
        const searchInput = document.getElementById("searchInput");
        const searchCount = document.getElementById("searchCount");
        const toastStack = document.getElementById("toastStack");
        const appShell = document.getElementById("appShell");
        const menuButton = document.getElementById("menuButton");
        const mobileMask = document.getElementById("mobileMask");

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function normalizeCard(item) {
            const themes = new Set(["sky", "green", "purple", "blue"]);
            return {
                id: String(item.id ?? "").trim(),
                title: String(item.title ?? "").trim(),
                range: String(item.range ?? "").trim(),
                template: item.template === "custom" ? "custom" : "default",
                templateLabel: String(item.templateLabel ?? "默认模板").trim() || "默认模板",
                theme: themes.has(item.theme) ? item.theme : "sky",
                dataTotal: Number(item.dataTotal) || 0,
                mediaTotal: Number(item.mediaTotal) || 0,
                peakSpread: Number(item.peakSpread) || 0,
                lastEdited: String(item.lastEdited ?? "").trim(),
                dataSource: String(item.dataSource ?? "").trim(),
                templateName: String(item.templateName ?? "").trim(),
                description: String(item.description ?? "").trim(),
                source: item.source === "custom" ? "custom" : "preset"
            };
        }

        function loadCreatedCards() {
            try {
                const parsed = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "[]");
                if (!Array.isArray(parsed)) {
                    return [];
                }
                const valid = parsed
                    .map((item) => normalizeCard({ ...item, source: "custom" }))
                    .filter((item) => item.id && item.title && (item.dataTotal > 0 || item.mediaTotal > 0));
                if (valid.length !== parsed.length) {
                    saveCreatedCards(valid);
                }
                return valid;
            } catch (error) {
                return [];
            }
        }

        function saveCreatedCards(cards) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
        }

        function syncEventCards() {
            const presetTitles = new Set(baseEventCards.map((c) => c.title));
            const created = loadCreatedCards().filter((c) => !presetTitles.has(c.title));
            eventCards = [
                ...created,
                ...baseEventCards.map((item) => normalizeCard({ ...item, source: "preset" }))
            ];
        }

        function openDetailPage(id, mode) {
            const params = new URLSearchParams({ id });
            if (mode) {
                params.set("mode", mode);
            }
            window.location.href = `${DETAIL_PAGE_PATH}?${params.toString()}`;
        }

        function showToast(message) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            toastStack.appendChild(toast);
            window.setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(8px)";
                toast.style.transition = "opacity 0.2s ease, transform 0.2s ease";
            }, 2200);
            window.setTimeout(() => toast.remove(), 2500);
        }

        function formatMetric(value, suffix) {
            return `<span class="stat-value"><strong>${Number(value) || 0}</strong><em>/${suffix}</em></span>`;
        }

        function parseDate(value) {
            return new Date(value.replace(/-/g, "/"));
        }

        function filteredCards() {
            let items = eventCards.filter((item) => {
                if (state.template !== "all" && item.template !== state.template) {
                    return false;
                }
                if (!state.search.trim()) {
                    return true;
                }
                const text = [item.title, item.range].join(" ").toLowerCase();
                return text.includes(state.search.trim().toLowerCase());
            });

            if (state.sort === "title") {
                items = items.sort((left, right) => left.title.localeCompare(right.title, "zh-CN"));
            } else if (state.sort === "volume") {
                items = items.sort((left, right) => right.dataTotal - left.dataTotal);
            } else {
                items = items.sort((left, right) => parseDate(right.lastEdited) - parseDate(left.lastEdited));
            }

            return items;
        }

        function closeMenus() {
            document.querySelectorAll(".card-menu.open").forEach((menu) => {
                menu.classList.remove("open");
            });
        }

        function renderCards() {
            const items = filteredCards();

            if (!items.length) {
                cardGrid.innerHTML = `
                    <div class="empty-state">
                        <strong>暂无匹配专题</strong>
                        <span>可以更换排序条件、模板类型或输入新的筛选内容继续查找。</span>
                    </div>
                `;
                return;
            }

            cardGrid.innerHTML = items.map((item) => `
                <article class="event-card" data-id="${item.id}">
                    <div class="card-cover ${item.theme}">
                        <span class="template-flag">${escapeHtml(item.templateLabel)}</span>
                        <h2 class="card-title">${escapeHtml(item.title)}</h2>
                        <div class="card-range">${escapeHtml(item.range)}</div>
                    </div>
                    <div class="card-stats">
                        <div class="stat-block">
                            ${formatMetric(item.dataTotal, "条")}
                            <div class="stat-label">数据总量</div>
                        </div>
                        <div class="stat-block">
                            ${formatMetric(item.mediaTotal, "个")}
                            <div class="stat-label">媒体总量</div>
                        </div>
                        <div class="stat-block">
                            ${formatMetric(item.peakSpread, "小时")}
                            <div class="stat-label">峰值传播量</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="edit-meta">
                            <span>最后编辑:</span>
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8V12L14.6 14.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span>${escapeHtml(item.lastEdited)}</span>
                        </div>
                        <div class="card-menu-wrap">
                            <button class="card-menu-button" type="button" data-action="toggle-menu" data-id="${item.id}" aria-label="更多操作">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5H12.01M12 12H12.01M12 19H12.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                            </button>
                            <div class="card-menu" id="menu-${item.id}">
                                <button type="button" data-action="edit" data-id="${item.id}">编辑</button>
                                <button type="button" data-action="export" data-id="${item.id}">导出</button>
                                <button type="button" data-action="delete" data-id="${item.id}">删除</button>
                            </div>
                        </div>
                    </div>
                </article>
            `).join("");
        }

        cardGrid.addEventListener("click", (event) => {
            const button = event.target.closest("[data-action]");
            if (!button) {
                const card = event.target.closest(".event-card");
                if (card) {
                    openDetailPage(card.dataset.id);
                }
                return;
            }

            const { action, id } = button.dataset;
            if (action === "toggle-menu") {
                const menu = document.getElementById(`menu-${id}`);
                const willOpen = !menu.classList.contains("open");
                closeMenus();
                menu.classList.toggle("open", willOpen);
                return;
            }

            closeMenus();
            if (action === "edit") {
                openDetailPage(id, "edit");
                return;
            }
            if (action === "export") {
                showToast("已导出当前分析专题");
                return;
            }
            if (action === "delete") {
                const index = eventCards.findIndex((item) => item.id === id);
                if (index >= 0) {
                    if (!baseCardIds.has(id)) {
                        saveCreatedCards(loadCreatedCards().filter((item) => item.id !== id));
                    }
                    eventCards.splice(index, 1);
                    renderCards();
                    showToast("分析专题已删除");
                }
            }
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".card-menu-wrap")) {
                closeMenus();
            }
        });

        createButton.addEventListener("click", () => {
            window.location.href = CREATE_PAGE_PATH;
        });

        sortSelect.addEventListener("change", (event) => {
            state.sort = event.target.value;
            renderCards();
        });

        templateSelect.addEventListener("change", (event) => {
            state.template = event.target.value;
            renderCards();
        });

        searchInput.addEventListener("input", (event) => {
            state.search = event.target.value;
            searchCount.textContent = `${state.search.length}/100`;
            renderCards();
        });

        function toggleSidebar() {
            document.body.classList.toggle("is-sidebar-open");
        }

        menuButton.addEventListener("click", toggleSidebar);

        menuButton.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleSidebar();
            }
        });

        mobileMask.addEventListener("click", () => {
            document.body.classList.remove("is-sidebar-open");
        });

        appShell.addEventListener("click", (event) => {
            if (event.target.closest("a.nav-item[href]")) {
                document.body.classList.remove("is-sidebar-open");
                return;
            }

            if (event.target.closest(".nav-item")) {
                showToast("当前阶段已补齐事件管理主页面，其余事件分析页面可继续按同风格扩展");
                document.body.classList.remove("is-sidebar-open");
            }
        });

        syncEventCards();
        renderCards();
    </script>
</body>
