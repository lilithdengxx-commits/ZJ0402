<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处置引导 - 选题线索池</title>
    <style>
        :root {
            --bg: #f6f8fc;
            --bg-deep: #edf2fa;
            --card: rgba(255, 255, 255, 0.86);
            --card-strong: #ffffff;
            --line: rgba(122, 145, 184, 0.14);
            --line-strong: rgba(122, 145, 184, 0.22);
            --text: #2a3448;
            --text-soft: #68778f;
            --text-faint: #9aa8bc;
            --primary: #2f6bff;
            --primary-deep: #1f54dd;
            --secondary: #9ec7ff;
            --secondary-soft: rgba(47, 107, 255, 0.08);
            --success: #19a581;
            --danger: #d96863;
            --warning: #ca9434;
            --teal: #13c3d0;
            --accent-gradient: linear-gradient(135deg, #2b61ea 0%, #4e88ff 56%, #77b6ff 100%);
            --shadow-lg: 0 28px 56px rgba(26, 44, 82, 0.1);
            --shadow-md: 0 16px 30px rgba(26, 44, 82, 0.08);
            --radius-xl: 36px;
            --radius-lg: 28px;
            --radius-md: 20px;
            --radius-sm: 16px;
            --sidebar-width: 248px;
            font-family: "Alibaba PuHuiTi 3.0", "HarmonyOS Sans SC", "Microsoft YaHei UI", sans-serif;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 12% -6%, rgba(47, 107, 255, 0.12), transparent 28%),
                radial-gradient(circle at 100% 0%, rgba(158, 199, 255, 0.18), transparent 24%),
                linear-gradient(180deg, #fbfcff 0%, #f5f7fb 46%, #eef2f8 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            top: -60px;
            right: -40px;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(47, 107, 255, 0.16) 0%, rgba(47, 107, 255, 0) 72%);
            filter: blur(18px);
        }

        body::after {
            left: -120px;
            bottom: 100px;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(158, 199, 255, 0.2) 0%, rgba(158, 199, 255, 0) 72%);
            filter: blur(16px);
        }

        a,
        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            column-gap: 24px;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            margin: 20px 0 20px 20px;
            padding: 18px 16px 24px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(246, 249, 253, 0.92));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(122, 145, 184, 0.14);
            border-radius: 28px;
            overflow-y: auto;
            box-shadow: 0 14px 28px rgba(26, 44, 82, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.78);
        }

        .sidebar::before {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            top: 82px;
            height: 1px;
            background: linear-gradient(90deg, rgba(47, 107, 255, 0.18), rgba(158, 199, 255, 0.14) 54%, transparent 80%);
        }

        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(131, 151, 194, 0.24);
            border-radius: 999px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 4px 6px 14px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .brand-title strong {
            font-size: 15px;
            letter-spacing: 0.02em;
            color: #2b62ce;
            font-weight: 900;
            white-space: nowrap;
        }

        .brand-title span {
            display: none;
        }

        .nav-group {
            margin-bottom: 14px;
        }

        .nav-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 10px 5px;
            margin-bottom: 8px;
            border-radius: 12px;
            color: #8793a6;
            font-size: 11px;
            font-weight: 800;
        }

        .nav-group-title .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-group-title svg {
            width: 14px;
            height: 14px;
            color: var(--primary);
        }

        .nav-group-title small {
            display: none;
        }

        .nav-group.active .nav-group-title {
            color: #3569d8;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            min-height: 46px;
            padding: 11px 14px;
            border: 1px solid rgba(122, 145, 184, 0.06);
            border-radius: 14px;
            background: transparent;
            color: #4f5f7c;
            font-size: 12px;
            font-weight: 700;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-item:hover {
            transform: translateX(2px);
            border-color: rgba(47, 107, 255, 0.14);
            background: rgba(255, 255, 255, 0.84);
            color: #375a8f;
            box-shadow: 0 8px 16px rgba(26, 44, 82, 0.04);
        }

        .nav-item.active {
            background: #ffffff;
            color: var(--primary);
            border-color: rgba(47, 107, 255, 0.08);
            box-shadow: 0 10px 20px rgba(26, 44, 82, 0.05);
            transform: none;
        }

        .nav-item small {
            display: none;
        }

        .main-area {
            min-width: 0;
            padding: 20px 20px 20px 0;
        }

        .page {
            padding: 18px 0 36px;
        }

        .topbar {
            position: sticky;
            top: 20px;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 68px;
            padding: 10px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(122, 145, 184, 0.12);
            box-shadow: var(--shadow-md);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            color: #3f5479;
            box-shadow: 0 10px 20px rgba(26, 44, 82, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(26, 44, 82, 0.08);
            border-color: rgba(47, 107, 255, 0.18);
            color: #3a73dd;
        }

        .topbar-title {
            display: flex;
            flex: 0 0 auto;
            cursor: default;
        }

        .topbar-title:focus-visible {
            outline: 2px solid rgba(47, 107, 255, 0.28);
            outline-offset: 4px;
        }

        .topbar-title span {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid rgba(47, 107, 255, 0.1);
            background: linear-gradient(180deg, rgba(47, 107, 255, 0.07), rgba(158, 199, 255, 0.12));
            color: var(--primary);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.01em;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .avatar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px 5px 5px;
            border-radius: 999px;
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 14px 24px rgba(47, 107, 255, 0.18);
        }

        .avatar strong {
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 0.02em;
        }

        .avatar-badge {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-weight: 800;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .metric-card {
            position: relative;
            overflow: hidden;
            min-height: 96px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(26, 44, 82, 0.08);
        }

        .metric-card::after {
            content: "";
            position: absolute;
            top: -18px;
            right: -12px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
        }

        .metric-card strong {
            position: relative;
            z-index: 1;
            display: block;
            font-size: 28px;
            line-height: 1;
            font-weight: 900;
        }

        .metric-card span {
            position: relative;
            z-index: 1;
            display: block;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0.96;
        }

        .metric-card small {
            position: relative;
            z-index: 1;
            display: block;
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.82;
        }

        .metric-total {
            background: linear-gradient(135deg, #4d63ea 0%, #7b74f7 100%);
        }

        .metric-ai {
            background: linear-gradient(135deg, #17b5d4 0%, #2f84ff 100%);
        }

        .metric-tracking {
            background: linear-gradient(135deg, #21b875 0%, #67ce8f 100%);
        }

        .metric-adopted {
            background: linear-gradient(135deg, #ff8f8f 0%, #eb6673 100%);
        }

        .metric-rejected {
            background: linear-gradient(135deg, #7f8798 0%, #a3aab8 100%);
        }

        .workspace-card {
            position: relative;
            overflow: hidden;
            margin-top: 18px;
            padding: 18px;
            border-radius: 24px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(248, 251, 255, 0.98));
            box-shadow: var(--shadow-lg);
        }

        .workspace-card::before {
            content: "";
            position: absolute;
            top: -90px;
            right: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(158, 199, 255, 0.18) 0%, rgba(158, 199, 255, 0) 72%);
            pointer-events: none;
        }

        .workspace-toolbar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(122, 145, 184, 0.1);
        }

        .toolbar-title strong {
            display: block;
            font-size: 18px;
            color: #1b263b;
        }

        .toolbar-title span {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: #7d8aa1;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .source-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .source-tab,
        .status-select,
        .search-box,
        .primary-button,
        .ghost-button,
        .mini-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: rgba(255, 255, 255, 0.92);
            color: #5e6f8d;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 8px 16px rgba(26, 44, 82, 0.04);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, background 0.2s ease;
        }

        .source-tab:hover,
        .status-select:hover,
        .search-box:hover,
        .primary-button:hover,
        .ghost-button:hover,
        .mini-button:hover {
            transform: translateY(-1px);
            border-color: rgba(47, 107, 255, 0.16);
            box-shadow: 0 12px 18px rgba(26, 44, 82, 0.06);
        }

        .source-tab.active {
            background: linear-gradient(135deg, rgba(47, 107, 255, 0.08), rgba(158, 199, 255, 0.16));
            color: var(--primary);
            border-color: rgba(47, 107, 255, 0.12);
        }

        .status-select select {
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            font-weight: 800;
        }

        .search-box {
            min-width: 260px;
            justify-content: flex-start;
            padding: 0 12px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: #9aa8bc;
        }

        .primary-button {
            border-color: transparent;
            background: var(--accent-gradient);
            color: #ffffff;
        }

        .ghost-button {
            color: var(--primary);
        }

        .clue-list {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
        }

        .clue-card {
            position: relative;
            overflow: hidden;
            padding: 18px 18px 16px;
            border-radius: 20px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 12px 22px rgba(26, 44, 82, 0.045);
        }

        .clue-card::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 4px;
            background: linear-gradient(180deg, #7cb2ff 0%, #2f6bff 100%);
        }

        .clue-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .badge-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge,
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            border: 1px solid rgba(122, 145, 184, 0.1);
            line-height: 1;
            white-space: nowrap;
        }

        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge.source-ai {
            color: #2f6bff;
            background: rgba(47, 107, 255, 0.08);
            border-color: rgba(47, 107, 255, 0.12);
        }

        .badge.source-manual {
            color: #17a37d;
            background: rgba(25, 165, 129, 0.08);
            border-color: rgba(25, 165, 129, 0.14);
        }

        .badge.source-system {
            color: #7d61d6;
            background: rgba(125, 97, 214, 0.08);
            border-color: rgba(125, 97, 214, 0.14);
        }

        .badge.domain {
            color: #5877a8;
            background: rgba(90, 149, 227, 0.08);
            border-color: rgba(90, 149, 227, 0.12);
        }

        .badge.platform {
            color: #7b879a;
            background: rgba(122, 145, 184, 0.08);
        }

        .status-pending {
            color: #b97a18;
            background: rgba(245, 179, 74, 0.12);
            border-color: rgba(245, 179, 74, 0.2);
        }

        .status-tracking {
            color: #1fa26f;
            background: rgba(25, 165, 129, 0.12);
            border-color: rgba(25, 165, 129, 0.18);
        }

        .status-adopted {
            color: #d25c67;
            background: rgba(234, 107, 118, 0.12);
            border-color: rgba(234, 107, 118, 0.18);
        }

        .status-rejected {
            color: #7c8494;
            background: rgba(124, 132, 148, 0.12);
            border-color: rgba(124, 132, 148, 0.18);
        }

        .clue-title {
            margin: 12px 0 0;
            font-size: 18px;
            line-height: 1.38;
            color: #193050;
        }

        .clue-summary {
            margin: 10px 0 0;
            font-size: 12px;
            line-height: 1.7;
            color: #556882;
        }

        .clue-analysis {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(122, 145, 184, 0.08);
            background: rgba(246, 249, 255, 0.86);
        }

        .clue-analysis strong {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #51729f;
        }

        .clue-analysis strong::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
        }

        .clue-analysis p {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.66;
            color: #5b6f8b;
        }

        .clue-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 18px;
            margin-top: 14px;
            color: #7a889d;
            font-size: 11px;
            font-weight: 700;
        }

        .clue-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed rgba(122, 145, 184, 0.12);
        }

        .priority-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 24px;
            padding: 0 10px;
            border-radius: 999px;
            background: rgba(47, 107, 255, 0.08);
            color: #4a72b1;
            font-size: 10px;
            font-weight: 800;
        }

        .clue-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-button {
            min-height: 34px;
            padding: 0 12px;
            font-size: 11px;
            box-shadow: none;
        }

        .mini-button.primary {
            background: rgba(47, 107, 255, 0.08);
            border-color: rgba(47, 107, 255, 0.12);
            color: var(--primary);
        }

        .mini-button.success {
            background: rgba(25, 165, 129, 0.08);
            border-color: rgba(25, 165, 129, 0.14);
            color: var(--success);
        }

        .mini-button.danger {
            background: rgba(217, 104, 99, 0.08);
            border-color: rgba(217, 104, 99, 0.14);
            color: var(--danger);
        }

        .empty-state {
            padding: 60px 28px;
            border-radius: 24px;
            border: 1px dashed rgba(98, 146, 216, 0.22);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(245, 249, 255, 0.98));
            color: #667695;
            text-align: center;
        }

        .empty-state strong {
            display: block;
            font-size: 22px;
            color: #182033;
            margin-bottom: 10px;
        }

        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(20, 31, 63, 0.28);
            backdrop-filter: blur(4px);
            z-index: 70;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 80;
            width: min(520px, calc(100vw - 32px));
            padding: 22px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(122, 145, 184, 0.14);
            box-shadow: 0 28px 56px rgba(26, 44, 82, 0.18);
            transform: translate(-50%, -50%);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-header strong {
            display: block;
            font-size: 18px;
            color: #1b263b;
        }

        .modal-header span {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: #7c899e;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 12px;
            font-weight: 800;
            color: #53667f;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 14px;
            border: 1px solid rgba(122, 145, 184, 0.14);
            outline: none;
            background: #ffffff;
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

            try {

                return raw ? JSON.parse(raw) : fallback;
            } catch (error) {
                return fallback;
            }
        }

        function writeStorage(key, value) {
            try {
                window.localStorage.setItem(key, JSON.stringify(value));
            } catch (error) {
                return false;
            }
            return true;
        }

        function parseDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? new Date() : date;
        }

        function formatDateTime(value) {
            const date = parseDate(value);
            const pad = (number) => String(number).padStart(2, "0");
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;

        function loadManualClues() {
            return readStorage(MANUAL_STORAGE_KEY, []).map((item) => {
                const statusMeta = getStatusMeta(item.status || "pending");
                return {
                    ...item,
                    sourceType: "manual",
                    sourceLabel: "手动添加",
                    status: item.status || "pending",
                    statusLabel: statusMeta.label,
                    priority: item.priority || "持续跟进"
                };
            });
        }

        function loadAiClues() {
            return readStorage(AI_STORAGE_KEY, []).map((item) => {
                const statusMeta = getStatusMeta(item.status || "pending");
                return {
                    ...item,
                    id: item.id || `ai-${item.sourceId}`,
                    sourceType: "ai",
                    sourceLabel: "来自AI智能推荐",
                    sourceName: item.originPage || "AI智能推荐",
                    summary: item.summary || item.analysis || "",
                    status: item.status || "pending",
                    statusLabel: item.statusLabel || statusMeta.label,
                    priority: item.priority || "高关注",
                    createdAt: item.createdAt || item.dateTime || item.addedAt,
                    addedAt: item.addedAt || item.createdAt || item.dateTime
                };
            });
        }

        function allClues() {
            return [...loadAiClues(), ...loadManualClues(), ...loadSeedClues()].sort((left, right) => {
                return parseDate(right.addedAt || right.createdAt) - parseDate(left.addedAt || left.createdAt);
            });
        }

        function visibleClues() {
            const query = state.query.trim().toLowerCase();
            return allClues().filter((item) => {
                if (state.source !== "all" && item.sourceType !== state.source) {
                    return false;
                }
                if (state.status !== "all" && item.status !== state.status) {
                    return false;
                }
                if (!query) {
                    return true;
                }

                const source = [
                    item.title,
                    item.summary,
                    item.analysis,
                    item.domain,
                    item.platform,
                    item.sourceName,
                    item.sourceLabel
                ].join(" ").toLowerCase();

                return source.includes(query);
            });
        }

        function overviewStats() {
            const items = allClues();
            return [
                {
                    title: "总线索数",
                    value: items.length,
                    helper: "当前池内全部线索",
                    className: "metric-total"
                },
                {
                    title: "已采纳",
                    value: items.filter((item) => item.sourceType === "ai").length,
                    helper: "已被选入到采编系统",
                    className: "metric-ai"
                },
                {
                    title: "已认领",
                    value: items.filter((item) => item.status === "tracking").length,
                    helper: "正在推进的选题线索",
                    className: "metric-tracking"
                },
                {
                    title: "已关闭",
                    value: items.filter((item) => item.status === "adopted").length,
                    helper: "已出除线索池",
                    className: "metric-adopted"
                },
                {
                    title: "已退回",
                    value: items.filter((item) => item.status === "rejected").length,
                    helper: "已结束或暂缓跟进",
                    className: "metric-rejected"
                }
            ];
        }

        function renderOverview() {
            overviewGrid.innerHTML = overviewStats().map((item) => `
                <article class="metric-card ${item.className}">
                    <strong>${item.value}</strong>
                    <span>${item.title}</span>
                    <small>${item.helper}</small>
                </article>
            `).join("");
        }

        function renderSourceTabs() {
            sourceTabsNode.innerHTML = sourceTabs.map((tab) => `
                <button class="source-tab ${state.source === tab.key ? "active" : ""}" type="button" data-source="${tab.key}">${tab.label}</button>
            `).join("");
        }

        function clueSourceBadge(item) {
            const sourceClass = item.sourceType === "ai"
                ? "source-ai"
                : item.sourceType === "manual"
                    ? "source-manual"
                    : "source-system";

            return `<span class="badge ${sourceClass}">${item.sourceLabel}</span>`;
        }

        function statusActions(item) {
            if (item.status === "pending") {
                return `
                    <button class="mini-button primary" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="tracking">转为跟进</button>
                    <button class="mini-button success" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="adopted">采纳</button>
                    <button class="mini-button danger" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="rejected">退回</button>
                `;
            }

            if (item.status === "tracking") {
                return `
                    <button class="mini-button success" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="adopted">采纳</button>
                    <button class="mini-button danger" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="rejected">退回</button>
                `;
            }

            if (item.status === "adopted") {
                return `
                    <button class="mini-button primary" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="tracking">继续跟进</button>
                    <button class="mini-button danger" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="rejected">退回</button>
                `;
            }

            return `
                <button class="mini-button primary" type="button" data-action="status" data-id="${item.id}" data-source-type="${item.sourceType}" data-next-status="pending">重新激活</button>
            `;
        }

        function extraActions(item) {
            const actions = [];
            if (item.sourceType === "ai") {
                actions.push(`<a class="mini-button" href="../../监测预警/AI智能推荐/index.html">查看AI推荐页</a>`);
                actions.push(`<button class="mini-button" type="button" data-action="remove" data-id="${item.id}" data-source-type="ai">移出线索池</button>`);
            }

            if (item.sourceType === "manual") {
                actions.push(`<button class="mini-button" type="button" data-action="remove" data-id="${item.id}" data-source-type="manual">删除线索</button>`);
            }

            return actions.join("");
        }

        function renderList() {
            const items = visibleClues();
            if (!items.length) {
                clueListNode.innerHTML = `
                    <div class="empty-state">
                        <strong>暂无匹配线索</strong>
                        <span>可以切换来源类型、放宽状态筛选，或通过“手动添加线索”补充新的选题来源。</span>
                    </div>
                `;
                return;
            }

            clueListNode.innerHTML = items.map((item) => {
                const statusMeta = getStatusMeta(item.status);
                return `
                    <article class="clue-card" data-id="${item.id}">
                        <div class="clue-card-top">
                            <div class="badge-row">
                                ${clueSourceBadge(item)}
                                <span class="badge domain">${item.domain}</span>
                                ${item.platform ? `<span class="badge platform">${item.platform}</span>` : ""}
                            </div>
                            <span class="status-badge status-${statusMeta.tone}">${statusMeta.label}</span>
                        </div>
                        <h3 class="clue-title">${item.title}</h3>
                        <p class="clue-summary">${item.summary}</p>
                        ${item.analysis ? `
                            <div class="clue-analysis">
                                <strong>研判摘要</strong>
                                <p>${item.analysis}</p>
                            </div>
                        ` : ""}
                        <div class="clue-meta">
                            <span>来源：${item.sourceName || item.platform || item.sourceLabel}</span>
                            <span>发布时间：${formatDateTime(item.createdAt || item.addedAt)}</span>
                            <span>入池时间：${formatDateTime(item.addedAt || item.createdAt)}</span>
                        </div>
                        <div class="clue-footer">
                            <span class="priority-chip">${item.priority || "持续跟进"}</span>
                            <div class="clue-actions">
                                ${statusActions(item)}
                                ${extraActions(item)}
                            </div>
                        </div>
                    </article>
                `;
            }).join("");
        }

        function updateSeedStatus(id, nextStatus) {
            const patches = readSeedPatches();
            patches[id] = {
                ...(patches[id] || {}),
                status: nextStatus,
                statusLabel: getStatusMeta(nextStatus).label,
                updatedAt: new Date().toISOString()
            };
            saveSeedPatches(patches);
        }

        function updateAiStatus(id, nextStatus) {
            const entries = readStorage(AI_STORAGE_KEY, []);
            const index = entries.findIndex((item) => (item.id || `ai-${item.sourceId}`) === id);
            if (index === -1) {
                return;
            }
            entries[index] = {
                ...entries[index],
                status: nextStatus,
                statusLabel: getStatusMeta(nextStatus).label,
                updatedAt: new Date().toISOString()
            };
            writeStorage(AI_STORAGE_KEY, entries);
        }

        function updateManualStatus(id, nextStatus) {
            const entries = readStorage(MANUAL_STORAGE_KEY, []);
            const index = entries.findIndex((item) => item.id === id);
            if (index === -1) {
                return;
            }
            entries[index] = {
                ...entries[index],
                status: nextStatus,
                statusLabel: getStatusMeta(nextStatus).label,
                updatedAt: new Date().toISOString()
            };
            writeStorage(MANUAL_STORAGE_KEY, entries);
        }

        function removeAiClue(id) {
            const nextEntries = readStorage(AI_STORAGE_KEY, []).filter((item) => (item.id || `ai-${item.sourceId}`) !== id);
            writeStorage(AI_STORAGE_KEY, nextEntries);
        }

        function removeManualClue(id) {
            const nextEntries = readStorage(MANUAL_STORAGE_KEY, []).filter((item) => item.id !== id);
            writeStorage(MANUAL_STORAGE_KEY, nextEntries);
        }

        function updateClueStatus(sourceType, id, nextStatus) {
            if (sourceType === "ai") {
                updateAiStatus(id, nextStatus);
            } else if (sourceType === "manual") {
                updateManualStatus(id, nextStatus);
            } else {
                updateSeedStatus(id, nextStatus);
            }

            render();
            showToast(`线索状态已更新为${getStatusMeta(nextStatus).label}`);
        }

        function removeClue(sourceType, id) {
            if (sourceType === "ai") {
                removeAiClue(id);
                showToast("已从线索池移除，并同步 AI智能推荐 的线索池状态");
            } else if (sourceType === "manual") {
                removeManualClue(id);
                showToast("手动添加的线索已删除");
            }
            render();
        }

        function render() {
            renderOverview();
            renderSourceTabs();
            renderList();
            statusFilter.value = state.status;
            searchInput.value = state.query;
        }

        sourceTabsNode.addEventListener("click", (event) => {
            const button = event.target.closest("[data-source]");
            if (!button) {
                return;
            }
            state.source = button.dataset.source;
            render();
        });

        statusFilter.addEventListener("change", (event) => {
            state.status = event.target.value;
            render();
        });

        searchInput.addEventListener("input", (event) => {
            state.query = event.target.value;
            render();
        });

        clueListNode.addEventListener("click", (event) => {
            const button = event.target.closest("[data-action]");
            if (!button) {
                return;
            }

            const { action, id, sourceType, nextStatus } = button.dataset;
            if (action === "status") {
                updateClueStatus(sourceType, id, nextStatus);
                return;
            }

            if (action === "remove") {
                removeClue(sourceType, id);
            }
        });

        openModalButton.addEventListener("click", openManualModal);
        closeModalButton.addEventListener("click", closeManualModal);
        cancelModalButton.addEventListener("click", closeManualModal);
        modalMask.addEventListener("click", closeManualModal);

        manualForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const formData = new FormData(manualForm);
            const entries = readStorage(MANUAL_STORAGE_KEY, []);
            const nextItem = {
                id: `manual-${Date.now()}`,
                sourceType: "manual",
                sourceLabel: "手动添加",
                sourceName: formData.get("sourceName") || "人工录入",
                title: String(formData.get("title") || "").trim(),
                summary: String(formData.get("summary") || "").trim(),
                domain: formData.get("domain") || "热点问题",
                platform: String(formData.get("platform") || "人工录入").trim(),
                priority: formData.get("priority") || "持续跟进",
                status: "pending",
                statusLabel: getStatusMeta("pending").label,
                createdAt: new Date().toISOString(),
                addedAt: new Date().toISOString()
            };

            if (!nextItem.title || !nextItem.summary) {
                showToast("请先补充线索标题和摘要");
                return;
            }

            entries.unshift(nextItem);
            writeStorage(MANUAL_STORAGE_KEY, entries);
            closeManualModal();
            render();
            showToast("已新增手动线索");
        });

        function toggleSidebar() {
            if (window.innerWidth <= 1080) {
                document.body.classList.toggle("is-sidebar-open");
            }
        }

        menuButton.addEventListener("click", toggleSidebar);

        menuButton.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleSidebar();
            }
        });

        mobileMask.addEventListener("click", () => {
            document.body.classList.remove("is-sidebar-open");
        });

        appShell.addEventListener("click", (event) => {
            if (event.target.closest("a.nav-item[href]")) {
                if (window.innerWidth <= 1080) {
                    document.body.classList.remove("is-sidebar-open");
                }
                return;
            }

            if (event.target.closest(".nav-item")) {
                showToast("当前阶段已还原 AI智能推荐 与 选题线索池，其余模块可继续按同风格补齐");
                if (window.innerWidth <= 1080) {
                    document.body.classList.remove("is-sidebar-open");
                }
            }
        });

        window.addEventListener("storage", (event) => {
            if ([AI_STORAGE_KEY, MANUAL_STORAGE_KEY, PATCH_STORAGE_KEY].includes(event.key)) {
                render();
            }
        });

        render();
    </script>
</body>
</html>
