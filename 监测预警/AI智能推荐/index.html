<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监测预警 - AI智能推荐（对比版）</title>
    <style>
        :root {
            --bg: #f0f2f7;
            --bg-deep: #e5e9f2;
            --card: rgba(255, 255, 255, 0.84);
            --card-strong: #ffffff;
            --line: rgba(122, 145, 184, 0.14);
            --line-strong: rgba(122, 145, 184, 0.22);
            --text: #1e2d45;
            --text-soft: #6b7c95;
            --text-faint: #9eb0c6;
            --primary: #2b61f0;
            --primary-deep: #1a4ed4;
            --secondary: #7ab0ff;
            --secondary-soft: rgba(43, 97, 240, 0.1);
            --success: #12a87a;
            --danger: #e04040;
            --warning: #c47d10;
            --sidebar-bg: #ffffff;
            --sidebar-width: 220px;
            font-family: "PingFang SC", "Lantinghei SC", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei UI", "微软雅黑", sans-serif;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--text);
            background: #eef1f8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            display: none;
        }

        a,
        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 44px 1fr;
            column-gap: 0;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            grid-row: 1 / -1;
            margin: 0;
            padding: 0;
            background: var(--sidebar-bg);
            border-right: none;
            border-radius: 0;
            overflow: visible;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 8px rgba(26, 44, 82, 0.08);
        }

        .sidebar-nav-area {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 10px 8px;
        }

        .sidebar-nav-area::-webkit-scrollbar {
            width: 3px;
        }

        .sidebar-nav-area::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 999px;
        }

        .sidebar-footer {
            flex: 0 0 auto;
            padding: 10px 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.07);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sidebar-footer .avatar {
            margin-right: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 14px;
            height: 44px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.07);
            flex: 0 0 44px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .brand-title strong {
            font-size: 14px;
            letter-spacing: 0.02em;
            color: var(--text);
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-title span {
            display: none;
        }

        .nav-group {
            margin-bottom: 0;
        }

        .nav-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 24px 6px 5px;
            margin-bottom: 2px;
            border-radius: 6px;
            color: #8a9ab8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }

        .nav-group-title:hover {
            color: #4a5c7a;
            background: transparent;
        }

        .nav-group-title .title-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-group-title svg {
            width: 12px;
            height: 12px;
            color: #8a9ab8;
        }

        .nav-group-title small {
            display: inline-flex;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.35);
            font-weight: 400;
            letter-spacing: 0;
            transition: transform 0.2s;
        }

        .nav-group.collapsed .nav-group-title small {
            transform: rotate(180deg);
        }

        .nav-group.active .nav-group-title {
            color: #4a5c7a;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .nav-group.collapsed .nav-items {
            display: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 34px;
            padding: 5px 10px 5px 14px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #4a5c7a;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.15s, color 0.15s;
        }

        .nav-item:hover {
            background: rgba(43, 97, 240, 0.06);
            color: var(--text);
            transform: none;
            box-shadow: none;
            border-color: transparent;
        }

        .nav-item.active {
            position: relative;
            background: rgba(43, 97, 240, 0.09);
            color: var(--primary);
            font-weight: 700;
            border-color: transparent;
            box-shadow: none;
            transform: none;
        }

        .nav-item.active::before {
            display: none;
        }

        .nav-item.active::after {
            content: "";
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            border-radius: 999px;
            background: var(--primary);
        }

        .nav-item small {
            display: none;
        }

        .main-area {
            min-width: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background: #eef1f8;
            min-height: calc(100vh - 44px);
            grid-row: 2;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 46px;
            padding: 0 16px;
            border-radius: 0;
            background: #ffffff;
            border-bottom: 1px solid rgba(122, 145, 184, 0.14);
            box-shadow: none;
            backdrop-filter: none;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .topbar-sep {
            color: #c5cdd9;
            font-size: 12px;
        }

        .topbar-module {
            color: #9aa8bc;
            font-size: 12px;
            font-weight: 600;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #7a8ea8;
            box-shadow: none;
            transition: background 0.15s, color 0.15s;
        }

        .icon-button:hover {
            background: rgba(43, 97, 240, 0.08);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .topbar-title {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            cursor: default;
        }

        .topbar-title:focus-visible {
            outline: 2px solid rgba(47, 107, 255, 0.28);
            outline-offset: 4px;
        }

        .topbar-title span {
            display: inline-flex;
            align-items: center;
            min-height: auto;
            padding: 0;
            border-radius: 0;
            border: none;
            background: none;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            -webkit-text-fill-color: currentColor;
            box-shadow: none;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-cluster {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .status-label {
            font-size: 11px;
            color: var(--text-faint);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(31, 209, 122, 0.08);
            color: #0f9360;
            border: 1px solid rgba(31, 209, 122, 0.16);
            font-size: 11px;
            font-weight: 700;
        }

        .status-pill::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1fd17a;
            box-shadow: none;
        }

        .avatar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 3px;
            border-radius: 999px;
            background: rgba(43, 97, 240, 0.07);
            border: 1px solid rgba(43, 97, 240, 0.13);
            color: var(--text);
            box-shadow: none;
        }

        .avatar strong {
            color: var(--text);
            font-size: 12px;
            letter-spacing: 0;
        }

        .avatar-badge {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            font-weight: 700;
            font-size: 11px;
        }

        .page {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            padding: 14px 16px 32px;
        }

        .metric-card {
            position: relative;
            padding: 20px 22px;
            border: 1px solid rgba(108, 137, 194, 0.12);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 250, 255, 0.92));
            box-shadow: 0 16px 28px rgba(57, 88, 142, 0.08);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .metric-card::before {
            display: none;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 36px rgba(57, 88, 142, 0.12);
        }

        .metric-card.active {
            border-color: rgba(72, 125, 255, 0.32);
            box-shadow: 0 18px 36px rgba(51, 125, 255, 0.16);
        }

        .metric-card .metric-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .metric-card .metric-label {
            color: var(--text-soft);
            font-size: 14px;
            font-weight: 700;
        }

        .metric-card .metric-value {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            line-height: 1;
        }

        .metric-card .metric-value strong {
            font-size: clamp(28px, 2.2vw, 40px);
            font-weight: 800;
        }

        .metric-card .metric-value span {
            color: var(--text-faint);
            font-size: 13px;
            font-weight: 700;
            padding-bottom: 4px;
        }

        .metric-note {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-faint);
        }

        .metric-card[data-accent="all"] strong {
            color: var(--secondary);
        }

        .metric-card[data-accent="read"] strong {
            color: #3d4f69;
        }

        .metric-card[data-accent="unread"] strong {
            color: var(--danger);
        }

        .metric-card[data-accent="queued"] strong {
            color: var(--primary);
        }

        .domain-card {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(26, 44, 82, 0.05);
        }

        .content-panel {
            position: relative;
            overflow: visible;
            margin-top: 10px;
            padding: 14px 16px 16px;
            border-radius: 12px;
            border: 1px solid rgba(122, 145, 184, 0.12);
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(26, 44, 82, 0.05);
        }

        .content-panel::before {
            display: none;
        }

        .content-panel .toolbar {
            margin-top: 0;
        }

        .panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: nowrap;
            position: relative;
            z-index: 1;
            min-height: 32px;
            border-bottom: none;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #1e2d45;
        }

        .panel-title .dot {
            display: none;
        }

        .panel-title small {
            color: #99a8bc;
            font-size: 14px;
            font-weight: 500;
        }

        .chip-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 0;
            padding-bottom: 0;
            overflow-x: auto;
            scrollbar-width: none;
            position: relative;
            z-index: 1;
            flex: 1 1 0;
            min-width: 0;
        }

        .chip-strip::-webkit-scrollbar {
            display: none;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            min-width: max-content;
            border-radius: 6px;
            border: 1px solid rgba(122, 145, 184, 0.18);
            background: #ffffff;
            color: #7f8ea3;
            font-size: 13px;
            font-weight: 400;
            box-shadow: none;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }

        .chip:hover {
            border-color: rgba(47, 107, 255, 0.22);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .chip.active {
            border-color: rgba(43, 97, 240, 0.35);
            background: rgba(43, 97, 240, 0.1);
            color: var(--primary);
            font-weight: 600;
            box-shadow: none;
        }

        .chip-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 999px;
            background: rgba(122, 145, 184, 0.1);
            color: #8393a9;
            font-size: 14px;
            font-weight: 700;
        }

        .chip.active .chip-count {
            background: rgba(47, 107, 255, 0.15);
            color: var(--primary);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 0;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
            padding: 0 0 12px;
            border: none;
            background: transparent;
            box-shadow: none;
            border-bottom: 1px solid rgba(122, 145, 184, 0.1);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        .toolbar-check-all {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid rgba(122, 145, 184, 0.16);
            background: #ffffff;
            color: #7f8ea3;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .toolbar-check-all:hover {
            border-color: rgba(47, 107, 255, 0.22);
            color: var(--primary);
        }

        .toolbar-check-all input {
            width: 14px;
            height: 14px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .toolbar-caption {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 0;
            border-radius: 0;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0;
            box-shadow: none;
        }

        .toolbar-search {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            flex: 0 1 200px;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid rgba(122, 145, 184, 0.14);
            background: #f8fafd;
            box-shadow: none;
        }

        .toolbar-search input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            color: var(--text);
            font-size: 14px;
        }

        .toolbar-search input::placeholder {
            color: #a8b7ca;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .select-like,
        .ghost-button,
        .filter-toggle,
        .insight-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid rgba(122, 145, 184, 0.16);
            background: #ffffff;
            color: #7f8ea3;
            font-size: 14px;
            font-weight: 400;
            box-shadow: none;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }

        .select-like:hover,
        .ghost-button:hover,
        .filter-toggle:hover,
        .insight-toggle:hover {
            border-color: rgba(47, 107, 255, 0.22);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .insight-toggle {
            justify-content: space-between;
            min-width: 120px;
            padding-right: 10px;
            padding-left: 12px;
        }

        .insight-toggle-label {
            font-size: 14px;
            font-weight: 400;
            color: inherit;
        }

        .insight-toggle-track {
            position: relative;
            width: 34px;
            height: 18px;
            border-radius: 999px;
            background: rgba(122, 145, 184, 0.22);
            box-shadow: none;
            transition: background 0.2s ease;
        }

        .insight-toggle-track::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 4px rgba(26, 44, 82, 0.12);
            transition: transform 0.2s ease;
        }

        .insight-toggle.active {
            border-color: rgba(47, 107, 255, 0.22);
            background: rgba(47, 107, 255, 0.06);
            color: var(--primary);
        }

        .insight-toggle.active .insight-toggle-track {
            background: var(--primary);
            box-shadow: none;
        }

        .insight-toggle.active .insight-toggle-track::after {
            transform: translateX(16px);
        }

        .select-like select {
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            font-weight: 400;
            font-size: 14px;
            appearance: none;
            cursor: pointer;
        }

        .filter-toggle.active {
            background: rgba(47, 107, 255, 0.08);
            color: var(--primary);
            border-color: rgba(47, 107, 255, 0.22);
            box-shadow: none;
        }

        .advanced-filters {
            display: none;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .advanced-filters.open {
            display: grid;
        }

        .filter-card {
            padding: 8px 0;
            border-radius: 0;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .filter-card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #38547d;
        }

        .toggle-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 14px;
            color: var(--text-soft);
        }

        .toggle-line + .toggle-line {
            margin-top: 8px;
        }

        .toggle-line input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 0;
            margin-top: 10px;
            align-items: start;
            position: relative;
            z-index: 1;
        }

        .content-grid.insights-hidden {
            grid-template-columns: minmax(0, 1fr);
        }

        .content-grid.insights-hidden .insight-sidebar {
            display: none;
        }

        .feed-column {
            min-width: 0;
            border-right: 1px solid rgba(122, 145, 184, 0.12);
            padding-right: 16px;
        }

        .insight-sidebar {
            position: sticky;
            top: 58px;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-left: 16px;
        }

        .insight-card {
            position: relative;
            overflow: visible;
            padding: 0 0 16px;
            border-radius: 0;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .insight-card + .insight-card {
            border-top: 1px solid rgba(122, 145, 184, 0.1);
            padding-top: 16px;
        }

        .insight-card::before {
            display: none;
        }

        .global-topbar {
            grid-column: 2;
            grid-row: 1;
            position: sticky;
            top: 0;
            z-index: 50;
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px 0 14px;
            background: #ffffff;
            border-bottom: 1px solid rgba(122, 145, 184, 0.14);
            box-shadow: 0 1px 4px rgba(26, 44, 82, 0.06);
            gap: 10px;
        }

        .topbar-module-label {
            font-size: 13px;
            color: var(--text-soft);
            font-weight: 600;
            flex: 0 0 auto;
        }

        .topbar-module-label.topbar-parent {
            color: var(--text-faint);
            font-weight: 500;
        }

        .topbar-spacer {
            flex: 1 1 auto;
        }

        .insight-card-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .insight-card-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .insight-card-title strong {
            font-size: 14px;
            font-weight: 700;
            color: #1d2a42;
        }

        .insight-card-title span,
        .insight-card-meta {
            font-size: 14px;
            font-weight: 400;
            color: #98a7bc;
            display: none;
        }

        .insight-summary-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .summary-item {
            padding: 4px 2px;
            border-radius: 0;
            border: none;
            background: transparent;
        }

        .summary-item span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: #95a4b8;
            letter-spacing: 0;
        }

        .summary-item strong {
            display: block;
            margin-top: 4px;
            font-size: 17px;
            line-height: 1;
            color: #172239;
        }

        .summary-item small {
            display: block;
            margin-top: 4px;
            font-size: 14px;
            color: #a7b5c8;
            font-weight: 400;
        }

        .trend-chart {
            position: relative;
            z-index: 1;
            padding: 0;
            border-radius: 0;
            border: none;
            background: transparent;
        }

        .trend-chart svg {
            display: block;
            width: 100%;
            height: 128px;
        }

        .trend-labels {
            display: grid;
            gap: 6px;
            margin-top: 8px;
        }

        .trend-labels span {
            font-size: 12px;
            font-weight: 400;
            color: #97a6bb;
            text-align: center;
            white-space: nowrap;
        }

        .sentiment-wrap {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 112px 1fr;
            gap: 14px;
            align-items: center;
        }

        .sentiment-ring {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: inset 0 0 0 1px rgba(122, 145, 184, 0.08);
        }

        .sentiment-ring-inner {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: inset 0 0 0 1px rgba(122, 145, 184, 0.1);
        }

        .sentiment-ring-inner strong {
            font-size: 20px;
            line-height: 1;
            color: #172239;
        }

        .sentiment-ring-inner span {
            margin-top: 4px;
            font-size: 12px;
            font-weight: 400;
            color: #9aa8bc;
        }

        .sentiment-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 0;
            border-radius: 0;
            border: none;
            background: transparent;
        }

        .legend-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 400;
            color: #6b7d96;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: 0 0 auto;
        }

        .legend-value {
            font-size: 12px;
            font-weight: 400;
            color: #63758f;
        }

        .word-cloud {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 12px;
            min-height: 140px;
        }

        .word-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(122, 145, 184, 0.1);
            background: rgba(255, 255, 255, 0.84);
            line-height: 1;
            font-weight: 400;
            letter-spacing: 0.01em;
            box-shadow: 0 8px 18px rgba(26, 44, 82, 0.04);
            transform-origin: center;
        }

        .insight-empty {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            padding: 18px;
            border-radius: 14px;
            border: 1px dashed rgba(122, 145, 184, 0.18);
            background: rgba(255, 255, 255, 0.74);
            color: #9aabc0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
        }

        .feed {
            margin-top: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: relative;
            z-index: 1;
        }

        .feed-card {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            overflow: visible;
            border: none;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            animation: none;
            transition: background 0.12s;
        }

        .feed-card + .feed-card {
            border-top: 1px solid rgba(122, 145, 184, 0.12);
            margin-top: 2px;
        }

        .feed-card:last-child {
            margin-bottom: 0;
        }

        .feed-card.menu-open {
            z-index: 25;
        }

        .feed-card:hover {
            background: rgba(43, 97, 240, 0.02);
            transform: none;
            box-shadow: none;
        }

        .feed-card[data-read="false"] {
            /* unread indicated by tag only */
        }

        .feed-card[data-read="false"] .feed-head {
            padding-left: 14px;
        }

        .feed-card::before {
            display: none;
        }

        .feed-card::after {
            display: none;
        }

        .feed-head {
            position: relative;
            min-width: 0;
            padding: 18px 16px 6px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .feed-checkbox {
            flex: 0 0 auto;
            margin-top: 3px;
            width: 15px;
            height: 15px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .feed-head-inner {
            min-width: 0;
            flex: 1 1 auto;
            padding-right: 0;
        }

        .tag-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .tag-list {
            display: flex;
            flex: 1 1 auto;
            min-width: 0;
            align-items: center;
    
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-height: 22px;
            padding: 0 7px;
            border-radius: 999px;
            border: 1px solid currentColor;
            font-size: 9.5px;
            font-weight: 800;
            line-height: 1;
            box-shadow: none;
        }

        .tag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .tag.domain {
            color: #4b7abb;
            background: rgba(47, 107, 255, 0.08);
            border-color: rgba(47, 107, 255, 0.12);
        }

        .tag.sentiment-negative {
            color: #d84a3a;
            background: rgba(233, 90, 77, 0.1);
            border-color: rgba(233, 90, 77, 0.16);
        }

        .tag.sentiment-neutral {
            color: #a06b00;
            background: rgba(255, 205, 104, 0.18);
            border-color: rgba(215, 138, 0, 0.16);
        }

        .tag.platform {
            color: #5f84b4;
            background: rgba(181, 215, 244, 0.18);
            border-color: rgba(181, 215, 244, 0.22);
        }

        .status-stamp {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-height: 22px;
            padding: 0 9px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(47, 107, 255, 0.08), rgba(158, 199, 255, 0.14));
            border: 1px solid rgba(47, 107, 255, 0.12);
            color: #4a78b8;
            font-size: 9.5px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            box-shadow: none;
        }

        .status-stamp::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .title-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
            flex-wrap: nowrap;
        }

        .feed-title {
            margin: 0;
            max-width: 980px;
            font-size: clamp(15px, 0.96vw, 18px);
            line-height: 1.32;
            font-weight: 850;
            color: #182033;
        }

        .feed-time {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 7px;
            white-space: nowrap;
            color: #7d8da4;
            font-size: 9.5px;
            font-weight: 800;
            line-height: 1;
            border-radius: 999px;
            background: #f7f9fd;
            border: 1px solid rgba(122, 145, 184, 0.1);
        }

        .feed-time::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--secondary);
            box-shadow: none;
        }

        .engagement-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .engagement-label {
            font-size: 9.5px;
            font-weight: 800;
            line-height: 1;
            color: #95a4b8;
            letter-spacing: 0.02em;
        }

        .engagement-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 22px;
            padding: 0 7px;
            border-radius: 999px;
            border: 1px solid rgba(122, 145, 184, 0.1);
            background: #f8fbff;
            color: #6d7f99;
            font-size: 9.5px;
            font-weight: 800;
            line-height: 1;
            box-shadow: none;
        }

        .engagement-item strong {
            color: #3a4d67;
            font-size: 9.5px;
            line-height: 1;
        }

        .card-menu-wrap {
            position: relative;
            z-index: 40;
            flex: 0 0 auto;
        }

        .menu-toggle {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(98, 146, 216, 0.14);
            border-radius: 9px;
            background: #ffffff;
            color: #425978;
            box-shadow: 0 5px 10px rgba(26, 44, 82, 0.035);
        }

        .menu-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 20px rgba(20, 31, 63, 0.08);
        }

        .card-menu {
            position: absolute;
            top: 36px;
            right: 0;
            width: 176px;
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(98, 146, 216, 0.14);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 14px 24px rgba(26, 44, 82, 0.07);
            display: none;
            z-index: 80;
        }

        .card-menu.open {
            display: block;
            animation: fadeIn 0.18s ease;
        }

        .card-menu button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #6d7f99;
            font-weight: 700;
            font-size: 14px;
            text-align: left;
        }

        .card-menu button:hover {
            background: #f4f7fd;
            color: var(--text);
        }

        .ai-panel {
            position: relative;
            min-width: 0;
            display: block;
            margin: 0 16px 18px calc(16px + 15px + 10px);
            padding: 4px 0 0;
            overflow: visible;
            color: var(--text);
            background: none;
            line-height: 1.65;
        }

        .ai-panel > div:last-child {
            display: inline;
        }

        .ai-panel::before {
            display: none;
        }

        .ai-panel::after {
            display: none;
        }

        .ai-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 5px;
            vertical-align: middle;
            position: relative;
            border-radius: 50%;
            background: var(--primary);
        }

        .ai-label {
            display: inline;
            color: #5273a6;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-right: 6px;
        }

        .ai-body {
            display: inline;
            font-size: 14px;
            line-height: 1.65;
            color: #50627c;
        }

        .ai-body,
        .insight-card-title span,
        .insight-card-meta,
        .summary-item span,
        .summary-item small,
        .trend-labels span,
        .sentiment-ring-inner span,
        .legend-label,
        .legend-value,
        .insight-empty,
        .toolbar-search input,
        .select-like,
        .ghost-button,
        .filter-toggle,
        .insight-toggle,
        .filter-card strong,
        .toggle-line,
        .card-menu button,
        .panel-title small,
        .chip,
        .chip-count {
            font-size: 14px;
            line-height: 1.65;
        }

        .metric-card .metric-value strong,
        .ai-label {
            font-weight: 700;
        }

        .feed-title {
            font-weight: 600;
        }

        .empty-state {
            padding: 56px 28px;
            border-radius: 28px;
            border: 1px dashed rgba(98, 146, 216, 0.22);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(245, 249, 255, 0.98));
            color: #667695;
            text-align: center;
        }

        .empty-state strong {
            display: block;
            font-size: 22px;
            color: #182033;
            margin-bottom: 10px;
        }

        .toast-stack {
            position: fixed;
            right: 24px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 80;
        }

        .toast {
            min-width: 240px;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(22, 35, 65, 0.92);
            box-shadow: 0 18px 34px rgba(20, 31, 63, 0.24);
            color: #ffffff;
            animation: toastIn 0.24s ease;
        }

        .mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, 0.28);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 20;
        }

        .is-sidebar-open .mobile-mask {
            opacity: 1;
            visibility: visible;
        }

        @keyframes liftIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1320px) {
            .advanced-filters {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 1280px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .insight-sidebar {
                position: static;
            }

            .feed-card {
                grid-template-columns: 1fr;
            }

            .ai-panel {
                margin: 0 14px 12px;
            }
        }

        @media (max-width: 1080px) {
            .app-shell {
                grid-template-columns: 1fr;
                column-gap: 0;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                height: 100vh;
                width: min(84vw, 240px);
                margin: 0;
                border-radius: 0;
                transform: translateX(-100%);
                transition: transform 0.24s ease;
                z-index: 30;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.28);
                overflow: visible;
            }

            .is-sidebar-open .sidebar {
                transform: translateX(0);
            }

            .main-area {
                padding: 0;
            }

            .page {
                padding: 12px 14px 24px;
            }
        }

        @media (max-width: 760px) {
            .insight-card {
                padding: 12px;
            }

            .sentiment-wrap {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .word-cloud {
                min-height: 120px;
            }

            .panel-heading {
                align-items: flex-start;
            }

            .title-row,
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar-title span {
                font-size: 13px;
            }

            .topbar-right {
                gap: 6px;
            }

            .feed-head,
            .ai-panel {
                padding-left: 14px;
                padding-right: 14px;
            }

            .feed-title {
                font-size: 14px;
            }

            .toolbar-search {
                min-width: 100%;
            }

            .toolbar-actions {
                width: 100%;
            }

            .select-like,
            .ghost-button,
            .filter-toggle,
            .insight-toggle {
                flex: 1 1 calc(50% - 6px);
            }

            .select-like {
                justify-content: space-between;
            }

            .advanced-filters {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const state = {

        const cluePoolAiStorageKey = "zj0330-topic-clue-pool-ai-v1";

        function readJsonStorage(key, fallback = []) {
            try {
                const raw = window.localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (error) {
                return fallback;
            }
        }

        function writeJsonStorage(key, value) {
            try {
                window.localStorage.setItem(key, JSON.stringify(value));
            } catch (error) {
                return false;
            }
            return true;
        }

        function buildAiClueEntry(item) {
            return {
                id: `ai-${item.id}`,
                sourceId: item.id,
                sourceType: "ai",
                originPage: "AI智能推荐",
                title: item.title,
                summary: item.summary,
                analysis: item.analysis,
                domain: item.domain,
                platform: item.platform,
                sentiment: item.sentiment,
                sentimentLabel: item.sentimentLabel,
                dateTime: item.dateTime,
                createdAt: item.dateTime,
                addedAt: new Date().toISOString(),
                status: "pending",
                statusLabel: "待收录",
                keywords: item.keywords || [],
                engagement: item.engagement || null
            };
        }

        function loadAiClueEntries() {
            return readJsonStorage(cluePoolAiStorageKey, []);
        }

        function saveAiClueEntries(entries) {
            writeJsonStorage(cluePoolAiStorageKey, entries);
        }

        function syncQueuedStateFromStorage() {
            const queuedIds = new Set(loadAiClueEntries().map((entry) => Number(entry.sourceId)));
            recommendationData.forEach((item) => {
                item.queued = queuedIds.has(item.id);
            });
        }

        function upsertAiClueEntry(item) {
            const nextEntry = buildAiClueEntry(item);
            const entries = loadAiClueEntries();
            const index = entries.findIndex((entry) => Number(entry.sourceId) === item.id);

            if (index >= 0) {
                const current = entries[index];
                entries[index] = {
                    ...nextEntry,
                    addedAt: current.addedAt || nextEntry.addedAt,
                    status: current.status || nextEntry.status,
                    statusLabel: current.statusLabel || nextEntry.statusLabel,
                    owner: current.owner || "",
                    note: current.note || ""
                };
            } else {
                entries.unshift(nextEntry);
            }

            saveAiClueEntries(entries);
        }

        function removeAiClueEntry(itemId) {
            const nextEntries = loadAiClueEntries().filter((entry) => Number(entry.sourceId) !== itemId);
            saveAiClueEntries(nextEntries);
        }

        function inSelectedPeriod(item) {
            if (state.period === "all") {
                return true;
            }

            const diffHours = (new Date("2026-03-30T18:00:00") - new Date(item.dateTime)) / 36e5;
            if (state.period === "today") {
                return diffHours <= 24;
            }
            if (state.period === "48h") {
                return diffHours <= 48;
            }
            return diffHours <= 168;
        }

        function matchesSearch(item) {
            const query = state.query.trim().toLowerCase();
            if (!query) {
                return true;
            }
            const source = [
                item.title,
                item.summary,
                item.analysis,
                item.platform,
                item.domain,
                item.sentimentLabel,
                item.keywords.join(" "),
                item.engagement ? Object.values(item.engagement).join(" ") : ""
            ]
                .join(" ")
                .toLowerCase();
            return source.includes(query);
        }

        function matchesAdvanced(item) {
            if (state.onlyUnread && item.read) {
                return false;
            }
            if (state.onlyHighRisk && item.risk !== "high") {
                return false;
            }
            if (state.onlyQueued && !item.queued) {
                return false;
            }
            return true;
        }

        function baseFilteredItems() {
            return recommendationData.filter((item) => inSelectedPeriod(item) && matchesSearch(item) && matchesAdvanced(item));
        }

        function visibleItems() {
            const base = baseFilteredItems();
            if (state.category === "全部") {
                return base;
            }
            return base.filter((item) => item.domain === state.category);
        }

        function categoryCounts() {
            const counts = Object.fromEntries(categoryOrder.map((item) => [item, 0]));
            const base = baseFilteredItems();
            counts["全部"] = base.length;
            base.forEach((item) => {
                counts[item.domain] = (counts[item.domain] || 0) + 1;
            });
            return counts;
        }

        function formatDate(dateTime) {
            const date = new Date(dateTime);
            const pad = (value) => String(value).padStart(2, "0");
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function formatShortTime(dateTime) {
            const date = new Date(dateTime);
            const pad = (value) => String(value).padStart(2, "0");
            return {
                full: `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`,
                short: `${pad(date.getHours())}:${pad(date.getMinutes())}`
            };
        }

        function renderCategories() {
            const counts = categoryCounts();
            categoryChipsNode.innerHTML = categoryOrder.map((category) => `
                <button class="chip ${state.category === category ? "active" : ""}" type="button" data-category="${category}">
                    <span>${category}</span>
                    <span class="chip-count">${counts[category] || 0}</span>
                </button>
            `).join("");
        }

        function buildTrendChart(items) {
            if (!items.length) {
                return `<div class="insight-empty">当前筛选结果下暂无趋势数据。</div>`;
            }

            const points = [...items]
                .sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime))
                .slice(-7)
                .map((item) => ({
                    value: item.score,
                    ...formatShortTime(item.dateTime)
                }));

            const chartWidth = 264;
            const chartHeight = 128;
            const padX = 14;
            const padTop = 16;
            const padBottom = 18;
            const baseline = chartHeight - padBottom;
            const step = points.length === 1 ? 0 : (chartWidth - padX * 2) / (points.length - 1);
            const values = points.map((point) => point.value);
            const minValue = Math.min(...values);
            const maxValue = Math.max(...values);
            const range = maxValue - minValue || 1;

            const coordinates = points.map((point, index) => {
                const x = points.length === 1 ? chartWidth / 2 : padX + step * index;
                const ratio = points.length === 1 ? 0.5 : (point.value - minValue) / range;
                const y = baseline - ratio * (baseline - padTop);
                return {
                    ...point,
                    x: Number(x.toFixed(2)),
                    y: Number(y.toFixed(2))
                };
            });

            const linePath = coordinates.length === 1
                ? `M ${padX} ${coordinates[0].y} L ${chartWidth - padX} ${coordinates[0].y}`
                : coordinates.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`).join(" ");

            const areaPath = coordinates.length === 1
                ? `M ${padX} ${baseline} L ${padX} ${coordinates[0].y} L ${chartWidth - padX} ${coordinates[0].y} L ${chartWidth - padX} ${baseline} Z`
                : `M ${coordinates[0].x} ${baseline} L ${coordinates.map((point) => `${point.x} ${point.y}`).join(" L ")} L ${coordinates[coordinates.length - 1].x} ${baseline} Z`;

            const gridLines = [0, 1, 2].map((gridIndex) => {
                const y = padTop + ((baseline - padTop) / 2) * gridIndex;
                return `<line x1="${padX}" y1="${y.toFixed(2)}" x2="${chartWidth - padX}" y2="${y.toFixed(2)}" stroke="rgba(122, 145, 184, 0.18)" stroke-dasharray="4 6" />`;
            }).join("");

            const pointNodes = coordinates.map((point, index) => `
                <circle cx="${point.x}" cy="${point.y}" r="${index === coordinates.length - 1 ? 4.5 : 3.5}" fill="${index === coordinates.length - 1 ? "#2f6bff" : "#86b4ff"}" stroke="#ffffff" stroke-width="2" />
            `).join("");

            return `
                <div class="trend-chart">
                    <svg viewBox="0 0 ${chartWidth} ${chartHeight}" fill="none" aria-hidden="true">
                        <defs>
                            <linearGradient id="trendLineGradient" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#7ab2ff" />
                                <stop offset="100%" stop-color="#2f6bff" />
                            </linearGradient>
                            <linearGradient id="trendAreaGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="rgba(47, 107, 255, 0.26)" />
                                <stop offset="100%" stop-color="rgba(47, 107, 255, 0.02)" />
                            </linearGradient>
                        </defs>
                        ${gridLines}
                        <path d="${areaPath}" fill="url(#trendAreaGradient)" />
                        <path d="${linePath}" stroke="url(#trendLineGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                        ${pointNodes}
                    </svg>
                </div>
                <div class="trend-labels" style="grid-template-columns: repeat(${points.length}, minmax(0, 1fr));">
                    ${points.map((point) => `<span title="${point.full}">${point.short}</span>`).join("")}
                </div>
            `;
        }

        function buildSentimentChart(items) {
            const config = [
                { key: "negative", label: "负面", color: "#ef6b5d" },
                { key: "neutral", label: "中立", color: "#f1b24a" },
                { key: "positive", label: "正面", color: "#22c3a6" }
            ];
            const counts = { negative: 0, neutral: 0, positive: 0 };
            items.forEach((item) => {
                counts[item.sentiment] = (counts[item.sentiment] || 0) + 1;
            });

            const total = items.length;
            let progress = 0;
            const gradient = total
                ? `conic-gradient(${config.map((entry) => {
                    const percent = (counts[entry.key] || 0) / total * 100;
                    const start = progress;
                    progress += percent;
                    return `${entry.color} ${start.toFixed(2)}% ${progress.toFixed(2)}%`;
                }).join(", ")})`
                : "conic-gradient(rgba(122, 145, 184, 0.14) 0 100%)";

            return `
                <div class="sentiment-wrap">
                    <div class="sentiment-ring" style="background:${gradient};">
                        <div class="sentiment-ring-inner">
                            <strong>${total}</strong>
                            <span>当前样本</span>
                        </div>
                    </div>
                    <div class="sentiment-legend">
                        ${config.map((entry) => {
                            const count = counts[entry.key] || 0;
                            const percent = total ? Math.round(count / total * 100) : 0;
                            return `
                                <div class="legend-item">
                                    <span class="legend-label"><span class="legend-dot" style="background:${entry.color};"></span>${entry.label}</span>
                                    <span class="legend-value">${count} 条 · ${percent}%</span>
                                </div>
                            `;
                        }).join("")}
                    </div>
                </div>
            `;
        }

        function buildWordCloud(items) {
            const keywordCounts = new Map();
            items.forEach((item) => {
                item.keywords.forEach((keyword) => {
                    keywordCounts.set(keyword, (keywordCounts.get(keyword) || 0) + 1);
                });
            });

            const words = [...keywordCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
            if (!words.length) {
                return `<div class="insight-empty">当前筛选条件下暂无高频关键词。</div>`;
            }

            const maxCount = words[0][1];
            const minCount = words[words.length - 1][1];
            const palette = ["#2f6bff", "#4289d8", "#22b5c8", "#667bff", "#f0a44a", "#4b7abb"];

            return `
                <div class="word-cloud">
                    ${words.map(([word, count], index) => {
                        const size = 14 + ((count - minCount) / (maxCount - minCount || 1)) * 4;
                        const rotate = [-4, 0, 3, -2, 1][index % 5];
                        return `<span class="word-chip" style="font-size:${size.toFixed(1)}px;color:${palette[index % palette.length]};transform:rotate(${rotate}deg);" title="出现 ${count} 次">${word}</span>`;
                    }).join("")}
                </div>
            `;
        }

        function renderInsights(items) {
            const total = items.length;
            const unreadCount = items.filter((item) => !item.read).length;
            const queuedCount = items.filter((item) => item.queued).length;
            const averageScore = total ? Math.round(items.reduce((sum, item) => sum + item.score, 0) / total) : 0;
            const latestItem = total ? [...items].sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime))[0] : null;

            insightsSidebar.innerHTML = `
                <section class="insight-card">

                    </div>
                    <div class="insight-summary-grid">
                        <div class="summary-item">

                        <div class="summary-item">
                            <span>平均热度</span>
                            <strong>${averageScore}</strong>

                        </div>
                        <div class="summary-item">
                            <span>线索池</span>
                            <strong>${queuedCount}</strong>
                            <small>已加入选题线索池</small>
                        </div>
                    </div>
                </section>

                <section class="insight-card">
                    <div class="insight-card-header">
                        <div class="insight-card-title">
                            <strong>趋势图</strong>
                            <span>近 7 条推荐热度走势</span>
                        </div>
                        <span class="insight-card-meta">热度峰值 ${total ? Math.max(...items.map((item) => item.score)) : 0}</span>
                    </div>
                    ${buildTrendChart(items)}
                </section>

                <section class="insight-card">
                    <div class="insight-card-header">
                        <div class="insight-card-title">
                            <strong>情感占比</strong>
                            <span>按当前推荐结果聚合</span>
                        </div>
                        <span class="insight-card-meta">负面关注优先</span>
                    </div>
                    ${buildSentimentChart(items)}
                </section>

                <section class="insight-card">
                    <div class="insight-card-header">
                        <div class="insight-card-title">
                            <strong>热点词云</strong>
                            <span>基于关键词频次生成</span>
                        </div>
                        <span class="insight-card-meta">最多展示 14 个词</span>
                    </div>
                    ${buildWordCloud(items)}
                </section>
            `;
        }

        function renderFeed(items) {
            toolbarCaption.textContent = `信息推荐 · 当前显示 ${items.length} 条`;
            if (categoryHint) categoryHint.textContent = state.category === "全部" ? "按领域查看推荐信息" : `当前已筛选为 ${state.category}`;

            if (!items.length) {
                feedNode.innerHTML = `
                    <div class="empty-state">
                        <strong>暂无匹配结果</strong>
                        <span>可以尝试放宽时间范围、取消高级筛选，或更换关键词继续检索。</span>
                    </div>
                `;
                return;
            }

            feedNode.innerHTML = items.map((item, index) => `
                <article class="feed-card" data-id="${item.id}" data-read="${item.read}" style="animation-delay:${index * 0.05}s">
                    <div class="feed-head">

                                    <div class="card-menu" id="menu-${item.id}">
                                        <button type="button" data-action="view-original" data-id="${item.id}"><span>查看原文</span><span>↗</span></button>
                                        <button type="button" data-action="toggle-read" data-id="${item.id}"><span>${item.read ? "标记未读" : "标记已读"}</span><span>●</span></button>
                                        <button type="button" data-action="create-alert" data-id="${item.id}"><span>预警</span><span>!</span></button>
                                        <button type="button" data-action="collect" data-id="${item.id}"><span>收藏</span><span>★</span></button>
                                        <button type="button" data-action="toggle-queue" data-id="${item.id}"><span>${item.queued ? "移出线索池" : "加入线索池"}</span><span>＋</span></button>
                                        <button type="button" data-action="add-material" data-id="${item.id}"><span>加入素材库</span><span>▣</span></button>
                                    </div>
                                </div>
                            </div>
                            <div class="title-row">
                                <h2 class="feed-title">${item.title}</h2>
                                <div class="title-meta">
                                    ${item.engagement ? `
                                    <span class="engagement-label">互动量</span>
                                    <span class="engagement-item">转发 <strong>${item.engagement.reposts}</strong></span>
                                    <span class="engagement-item">评论 <strong>${item.engagement.comments}</strong></span>
                                    <span class="engagement-item">点赞 <strong>${item.engagement.likes}</strong></span>
                                    ` : ""}
                                    <span class="feed-time">${formatDate(item.dateTime)}</span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="ai-panel"><span class="ai-indicator"></span><span class="ai-label">AI 研判分析</span><span class="ai-body">${item.analysis}</span></div>
                </article>
            `).join("");
        }

        function render() {
            const items = visibleItems();
            renderCategories();
            renderFeed(items);
            if (state.showInsights) {
                renderInsights(items);
            }
            contentGrid.classList.toggle("insights-hidden", !state.showInsights);
            insightsSidebar.hidden = !state.showInsights;
            insightToggle.classList.toggle("active", state.showInsights);
            insightToggle.setAttribute("aria-pressed", String(state.showInsights));
            advancedFilters.classList.toggle("open", state.showAdvanced);
            filterToggle.classList.toggle("active", state.showAdvanced);
        }

        function showToast(message) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            toastStack.appendChild(toast);
            window.setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(8px)";
                toast.style.transition = "opacity 0.2s ease, transform 0.2s ease";
            }, 2200);
            window.setTimeout(() => toast.remove(), 2500);
        }

        function closeMenus(exceptId) {
            document.querySelectorAll(".feed-card.menu-open").forEach((card) => {
                if (!exceptId || card.dataset.id !== String(exceptId)) {
                    card.classList.remove("menu-open");
                }
            });

            document.querySelectorAll(".card-menu").forEach((menu) => {
                if (!exceptId || menu.id !== `menu-${exceptId}`) {
                    menu.classList.remove("open");
                }
            });
        }

        function findItem(id) {
            return recommendationData.find((item) => item.id === Number(id));
        }

        categoryChipsNode.addEventListener("click", (event) => {
            const chip = event.target.closest(".chip");
            if (!chip) {
                return;
            }
            state.category = chip.dataset.category;
            render();
        });

        searchInput.addEventListener("input", (event) => {
            state.query = event.target.value;
            render();
        });

        periodSelect.addEventListener("change", (event) => {
            state.period = event.target.value;
            render();
        });

        filterToggle.addEventListener("click", () => {
            state.showAdvanced = !state.showAdvanced;
            render();
        });

        insightToggle.addEventListener("click", () => {
            state.showInsights = !state.showInsights;
            render();
        });

        onlyUnread.addEventListener("change", (event) => {
            state.onlyUnread = event.target.checked;
            render();
        });

        onlyHighRisk.addEventListener("change", (event) => {
            state.onlyHighRisk = event.target.checked;
            render();
        });

        onlyQueued.addEventListener("change", (event) => {
            state.onlyQueued = event.target.checked;
            render();
        });

        resetButton.addEventListener("click", () => {
            state.category = "全部";
            state.query = "";
            state.period = "today";
            state.showAdvanced = false;
            state.onlyUnread = false;
            state.onlyHighRisk = false;
            state.onlyQueued = false;
            searchInput.value = "";
            periodSelect.value = "today";
            onlyUnread.checked = false;
            onlyHighRisk.checked = false;
            onlyQueued.checked = false;
            render();
            showToast("筛选条件已重置");
        });

        feedNode.addEventListener("click", (event) => {
            const actionButton = event.target.closest("[data-action]");
            if (!actionButton) {
                return;
            }

            const { action, id } = actionButton.dataset;
            const item = findItem(id);
            if (!item) {
                return;
            }

            if (action !== "toggle-menu") {
                closeMenus();
            }

            if (action === "toggle-menu") {
                const menu = document.getElementById(`menu-${id}`);
                const card = actionButton.closest(".feed-card");
                const isOpen = menu.classList.contains("open");
                closeMenus(id);
                menu.classList.toggle("open", !isOpen);
                if (card) {
                    card.classList.toggle("menu-open", !isOpen);
                }
                return;
            }

            if (action === "toggle-read") {
                item.read = !item.read;
                render();
                showToast(item.read ? "已标记为已读" : "已恢复为未读");
                return;
            }

            if (action === "toggle-queue") {
                item.queued = !item.queued;
                if (item.queued) {
                    upsertAiClueEntry(item);
                } else {
                    removeAiClueEntry(item.id);
                }
                render();
                showToast(item.queued ? "已加入线索池，可在选题线索池查看" : "已移出线索池");
                return;
            }

            if (action === "view-original") {
                showToast(`已打开原文线索：${item.title.slice(0, 14)}…`);
                return;
            }

            if (action === "create-alert") {
                showToast("已创建预警跟踪任务");
                return;
            }

            if (action === "collect") {
                showToast("已加入个人收藏");
                return;
            }

            if (action === "add-material") {
                showToast("已加入素材库待编审");
            }
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".card-menu-wrap")) {
                closeMenus();
            }
        });

        function toggleSidebar() {
            if (window.innerWidth <= 1080) {
                document.body.classList.toggle("is-sidebar-open");
            }
        }

        if (menuButton) menuButton.addEventListener("click", toggleSidebar);

        if (menuButton) menuButton.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleSidebar();
            }
        });

        mobileMask.addEventListener("click", () => {
            document.body.classList.remove("is-sidebar-open");
        });

        appShell.addEventListener("click", (event) => {
            if (event.target.closest("a.nav-item[href]")) {
                if (window.innerWidth <= 1080) {
                    document.body.classList.remove("is-sidebar-open");
                }
                return;
            }

            if (event.target.closest(".nav-item")) {
                showToast("当前阶段仅生成智能推荐页，其余模块可按同一风格继续扩展");
                if (window.innerWidth <= 1080) {
                    document.body.classList.remove("is-sidebar-open");
                }
            }
        });

        window.addEventListener("storage", (event) => {
            if (event.key === cluePoolAiStorageKey) {
                syncQueuedStateFromStorage();
                render();
            }
        });

        // 左侧菜单折叠逻辑
        (function initNavCollapse() {
            // 默认全部展开，点击分组标题切换折叠
            document.querySelectorAll('.nav-group-title').forEach(function(title) {
                title.addEventListener('click', function() {
                    var group = this.closest('.nav-group');
                    group.classList.toggle('collapsed');
                });
            });
        })();

        syncQueuedStateFromStorage();
        render();

        // 全选复选框联动
        const selectAllCheckbox = document.getElementById("selectAll");
        if (selectAllCheckbox) {
            selectAllCheckbox.addEventListener("change", () => {
                document.querySelectorAll(".feed-checkbox").forEach(cb => {
                    cb.checked = selectAllCheckbox.checked;
                });
            });
            feedNode.addEventListener("change", (e) => {
                if (e.target.classList.contains("feed-checkbox")) {
                    const all = document.querySelectorAll(".feed-checkbox");
                    const checked = document.querySelectorAll(".feed-checkbox:checked");
                    selectAllCheckbox.indeterminate = checked.length > 0 && checked.length < all.length;
                    selectAllCheckbox.checked = checked.length === all.length;
                }
            });
        }
        function openAIForRecommend() {
            var sel = Array.from(document.querySelectorAll('.feed-checkbox:checked'))
                .map(function(cb){ var card = cb.closest('.feed-card'); return card ? card.querySelector('.feed-title').textContent.trim() : ''; })
                .filter(Boolean);
            if (!sel.length) sel = Array.from(document.querySelectorAll('.feed-title')).map(function(t){ return t.textContent.trim(); }).slice(0, 6);
            window.aiAssistantOpenWithData(sel);
        }
    </script>
<script src="../../shared/ai-assistant.js"></script>
</body>
</html>
